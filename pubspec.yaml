name: lirih
description: "Lirih - offline music player with 432/528 Hz frequency tuning presets."
# Package ini adalah APLIKASI, bukan paket publik → jangan pernah publish ke pub.dev.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Dart versi minimal mengikuti dependensi (riverpod_generator ^3.11, very_good_analysis ^3.13)
  sdk: ^3.13.0

# ── Dependensi runtime ─────────────────────────────────────────────
# WAJIB urut alfabet — lint `sort_pub_dependencies` (task 0.4).
# Versi mengikuti `THIRD_PARTY_NOTICES.md` (task R9).
dependencies:
  audio_service: ^0.18.19 # notifikasi media & layar kunci
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1 # Either<Failure, T> di layer repository
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2 # state management
  freezed_annotation: ^3.1.0 # immutability untuk entity/DTO
  go_router: ^18.0.2 # deklaratif routing
  hive_ce: ^2.20.1 # penyimpanan lokal (playlist, pengaturan)
  hive_ce_flutter: ^2.4.0 # binding Hive untuk Flutter
  json_annotation: ^4.12.0 # serialisasi model
  on_audio_query: ^2.9.0 # pembacaan MediaStore (lagu, album, artis)
  permission_handler: ^13.0.2 # izin baca media (Android 13+)
  riverpod_annotation: ^4.0.7 # anotasi @riverpod untuk codegen

# ── Dependensi development ─────────────────────────────────────────
dev_dependencies:
  build_runner: ^2.16.1 # menjalankan code generator
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2 # generator untuk freezed_annotation
  hive_ce_generator: ^1.11.3 # generator TypeAdapter (pengganti hive_generator)
  json_serializable: ^6.14.1 # generator untuk json_annotation
  mocktail: ^1.0.5 # mocking pada unit test
  riverpod_generator: ^4.0.9 # generator untuk riverpod_annotation
  very_good_analysis: ^11.0.0 # linter — task 0.4

flutter:
  # Ikon Material bawaan dipakai untuk ikon player sementara
  # (ikon final = buatan sendiri, task 0N.5)
  uses-material-design: true

# Linter — task 0.4
# Dasar: Very Good Analysis (https://pub.dev/packages/very_good_analysis)
# Sengaja dipilih karena paling ketat di ekosistem Dart/Flutter.
# Kualitas = exit criteria CI (task 0.5): `flutter analyze` harus 0 issue.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Artefak build & platform (bukan kode Dart proyek)
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - windows/**
    - web/**
    # Hasil code_runner — otomatis dibuat, jangan dianalisis
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

  errors:
    # File generated boleh punya pelanggaran style; abaikan, jangan gagalkan CI
    invalid_annotation_target: ignore

linter:
  rules:
    # ── DINONAKTIFKAN (keputusan 6 Okt 2026) ──────────────────────
    # Aturan ini baru di Dart 3.13 dan meminta konstruktor ditulis:
    #     class C { const new({super.key}); }      ← lint mau begini
    #     class C { const C({super.key}); }        ← Flutter 3.47 pakai ini
    #
    # Template resmi Flutter 3.47 (`flutter create`) MASIH memakai sintaks
    # berNama, dan 0 dari seluruh template Flutter memakai sintaks `new`.
    # Mengaktifkan aturan ini membuat setiap widget yang ditulis mengikuti
    # tutorial resmi langsung gagal `flutter analyze`.
    #
    # Aktifkan kembali (`true`) setelah Flutter sendiri mengadopsi sintaks baru.
    unnecessary_type_name_in_constructor: false

    # ── Penambahan khusus proyek Lirih ─────────────────────────────
    prefer_single_quotes: true
    directives_ordering: true
    sort_pub_dependencies: true

# Catatan aturan bawaan Very Good yang tetap berlaku dan patut diketahui:
#   - public_member_api_docs   → semua member publik di lib/ wajib berdokumentasi
#   - lines_longer_than_80     → maksimum 80 karakter per baris
#   - prefer_const_constructors, always_declare_return_types,
#     always_put_required_named_parameters_first, avoid_print, dll.

# CI — task 0.5 (MelodicDSP-Roadmap-v1-Offline.md)
#
# Tiga lapis pemeriksaan:
#   1. quality  → dart format + flutter analyze + flutter test (wajib lulus semua PR/push)
#   2. guard    → cegah keystore / key.properties masuk repo (task 0.10)
#   3. build    → verifikasi `flutter build appbundle` masih sukses (manual dispatch)
#
# ⚠️ CATATAN PENTING — TANDA TANGAN DIGITAL (task 0.10):
#   AAB yang diunggah ke Google Play DIBUAT DI MESIN LOKAL dengan keystore
#   yang TIDAK PERNAH masuk repo. Job `build` di sini HANYA untuk memastikan
#   build release tidak rusak — artefaknya TIDAK layak tanda tangan Play.
#
# ⚠️ Keystore & key.properties wajib masuk .gitignore:
#     key.properties
#     *.jks
#     *.keystore
#     *.p12
#     *.pem
#     service-account*.json

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────── 1. KUALITAS
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # Gagal bila ada file yang belum diformat — perbaiki dengan: dart format .
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # Sengaja TANPA --fatal-infos: very_good_analysis sudah sangat ketat.
        # Naikkan ke `dart analyze --fatal-infos` setelah codebase stabil.
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # ─────────────────────────────────────────────── 2. PENJAGA RAHASIA
  signing-guard:
    name: Guard signing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if signing material is committed
        # Task 0.10: keystore + upload key TIDAK BOLEH di-commit.
        run: |
          MATCHES=$(git ls-files | grep -Ei '\.(jks|keystore|p12|pem)$|(^|/)key\.properties$|service-account[^/]*\.json$' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::File penanda tangan ter-commit ke repo — HAPUS SEGERA dan putar kunci:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — tidak ada material tanda tangan di repo."

  # ─────────────────────────────────────────────── 3. VERIFIKASI BUILD
  build:
    name: Verify appbundle (release)
    needs: [ quality, signing-guard ]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        # Wajib — AGP untuk targetSdk 36 membutuhkan JDK 17+
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle
        # Play Store HANYA menerima .aab — bukan .apk
        run: flutter build appbundle --release

      - name: Upload artefak (VERIFIKASI SAJA — bukan untuk Play)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-for-play
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 7
